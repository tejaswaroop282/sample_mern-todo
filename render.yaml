# Generated by DevPilot. Review every line before you commit it.
# Secret values are NOT in this file. Variables marked 'sync: false' are asked for by Render when you create the Blueprint.
services:
  # The Express API, built from the Dockerfile that CI also builds.
  - type: web
    name: sample-mern-todo-api
    runtime: docker
    plan: free
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    healthCheckPath: /health
    autoDeployTrigger: checksPass  # deploy only after the CI checks pass
    envVars:
      - key: MONGODB_URI
        sync: false

  # The React client, built to static files.
  - type: web
    name: sample-mern-todo-client
    runtime: static
    buildCommand: cd client && npm ci && npm run build
    staticPublishPath: ./client/dist
    autoDeployTrigger: checksPass
    routes:
      - type: rewrite  # lets client-side routes such as /todos load index.html
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
